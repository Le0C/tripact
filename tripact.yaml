schemaVersion: 1

layers:
  specs:
    role: prescriptive
    paths:
      - UAC.md
  # Descriptive = documentation of behaviour a test could walk. Deliberately NOT `docs/**/*.md`:
  # that swept in planning and architecture prose (the feedback roadmap, the contract's
  # compatibility policy), whose sections are not procedures, so a docs↔tests verdict on them is
  # meaningless. README.md is hand-authored — not derived, and this repo declares no `derived`
  # outputs at all — but it is still not a source here: its sections are orientation prose for a
  # newcomer, not procedures a test could walk, so a docs↔tests verdict on them is meaningless for
  # the same reason. `docs/manual/` is declared ahead of having content — the on-ramp for a real manual.
  docs:
    role: descriptive
    paths:
      - docs/manual/**/*.md
  tests:
    role: verificatory
    paths:
      - test/**/*.test.ts
    tagPattern: "@specs:([a-z0-9.-]+)"
    sectionTagPattern: "@docs:([a-z0-9.-]+)"

edges:
  - [specs, tests]
  - [docs, tests]

accept:
  policy: agents

# Navigational code↔spec links (UAC §20.1). Declared OUTSIDE layers/edges: a code file set is never
# a layer and never an edge, so a tag here is navigation only — it never makes a claim "covered".
# `tagPattern` defaults to the verificatory layer's (@specs:<id>), which is what we want: one tag
# vocabulary for both tests and code.
codeLinks:
  paths:
    - src/**/*.ts
