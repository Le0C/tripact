schemaVersion: 1

layers:
  specs:
    role: prescriptive
    paths:
      - UAC.md
  # Descriptive = documentation of behaviour a test could walk. Deliberately NOT `docs/**/*.md`:
  # that swept in planning and architecture prose (the feedback roadmap, the contract's
  # compatibility policy), whose sections are not procedures, so a docs↔tests verdict on them is
  # meaningless. `docs/manual/` is declared ahead of having content — the on-ramp for a real manual.
  manual:
    role: descriptive
    paths:
      - README.md
      - docs/manual/**/*.md
  tests:
    role: verificatory
    paths:
      - test/**/*.test.ts
    tagPattern: "@specs:([a-z0-9.-]+)"
    sectionTagPattern: "@manual:([a-z0-9.-]+)"

edges:
  - [specs, tests]
  - [manual, tests]

accept:
  policy: agents
