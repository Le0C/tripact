schemaVersion: 1

layers:
  specs:
    role: prescriptive
    paths:
      - UAC.md
  # Descriptive = documentation of behaviour a test could walk. Deliberately NOT `docs/**/*.md`:
  # that swept in planning and architecture prose (the feedback roadmap, the contract's
  # compatibility policy), whose sections are not procedures, so a docs↔tests verdict on them is
  # meaningless. README.md is hand-authored — not derived, and this repo declares no `derived`
  # outputs at all — but it is still not a source here: its sections are orientation prose for a
  # newcomer, not procedures a test could walk, so a docs↔tests verdict on them is meaningless for
  # the same reason. Each page under `docs/manual/` is walked by a matching `test/manual/*.test.ts`,
  # which tags the section slug and the spec ids on ONE line so the pact bridges only what the page
  # genuinely documents (UAC §6.4). Much of this spec is engine behaviour a user manual should never
  # describe — sidecar format, re-anchoring, generator resolution, the cross-cutting properties — so
  # a permanently incomplete three-way reading here is the intended state, not a backlog.
  docs:
    role: descriptive
    paths:
      - docs/manual/**/*.md
  tests:
    role: verificatory
    paths:
      - test/**/*.test.ts
    tagPattern: "@specs:([a-z0-9.-]+)"
    sectionTagPattern: "@docs:([a-z0-9.-]+)"

edges:
  - [specs, tests]
  - [docs, tests]

accept:
  policy: agents

# Block-level derived regions (UAC §18.3). The README documented the five spec-system presets in four
# hand-maintained places, and `cursor` was added to the registry with tests without reaching any of
# them. The table is now rendered from `SPEC_SYSTEM_PRESETS`, so adding a preset updates the docs.
blocks:
  paths:
    - README.md
    - docs/manual/**/*.md
  generators:
    presets-table: builtin:presets-table
    task-classes: builtin:task-classes

# Navigational code↔spec links (UAC §20.1). Declared OUTSIDE layers/edges: a code file set is never
# a layer and never an edge, so a tag here is navigation only — it never makes a claim "covered".
# `tagPattern` defaults to the verificatory layer's (@specs:<id>), which is what we want: one tag
# vocabulary for both tests and code.
codeLinks:
  paths:
    - src/**/*.ts
