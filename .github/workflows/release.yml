name: Release

# Publishes to npm when a v* tag is pushed. Manual `npm publish` from a laptop still works and is
# unaffected by this file — but it cannot carry provenance, which requires OIDC from a CI runner.
# So: tag to publish with provenance, or publish by hand without it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Required for npm provenance: the runner mints an OIDC token that npm records as proof of which
  # workflow, commit and repository produced the tarball.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tripact resolves sync-points from git history; the self-check below needs it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - run: pnpm run build

      # Everything CI already enforces on main, re-run here: a tag is the one build that reaches
      # users, so it re-earns the guarantees rather than inheriting them from an earlier green run.
      - name: tripact check — the tree must be level
        run: node dist/cli.js check --strict

      # A tag whose package.json version does not match it publishes something nobody asked for.
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # Trusted publishing (OIDC) needs npm >= 11.5.1; actions/setup-node ships npm 10.x with
      # Node 22, so upgrade it in-runner. The newer CLI is what exchanges the workflow's id-token
      # for a short-lived publish credential — there is no long-lived NPM_TOKEN secret to leak.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        # Authentication is the OIDC id-token exchange with the npm trusted publisher configured
        # for Le0C/tripact + this workflow file. Provenance is attached automatically (kept
        # explicit for the reader) and requires this repository to be public. No NODE_AUTH_TOKEN.
        run: npm publish --provenance --access public
