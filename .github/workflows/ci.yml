name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR from a fork must not be able to escalate: the default token is read-only, and no job
# below passes --allow-shell, so a branch that edits tripact.yaml cannot get a shell on a runner
# (SECURITY.md, UAC §18.5).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the declared floor (package.json engines); 24 is the current LTS. fs.globSync,
        # which the layer scan depends on, was experimental across 22.x, so the floor is tested
        # rather than assumed.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # tripact resolves sync-points from git history; a shallow clone hides them and the
          # self-check below would silently fall back to a full audit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  # The four checks the PR template asks contributors to self-certify, enforced once rather than
  # trusted. Split from the matrix because each is a property of the tree, not of a Node version.
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: tripact check — the tree must be level
        # The project's one hard rule (CONTRIBUTING.md): spec, docs and tests describe the same
        # behaviour. No --allow-shell: this repo's generators are all builtin:, so needing the
        # flag here would itself be the signal that something changed.
        run: node dist/cli.js check

      - name: Derived outputs are current
        # generate is byte-deterministic, so a dirty tree afterwards means a committed derived
        # artefact drifted from its generator.
        run: |
          node dist/cli.js generate
          git diff --exit-code || {
            echo "::error::a derived output is stale — run 'tripact generate' and commit the result"
            exit 1
          }

      - name: Emitted skills are current
        # .claude/skills/ is generated from src/skills.ts and committed. Nothing else regenerates
        # it, so an edit to the skill prose silently leaves the committed copies behind — the exact
        # drift class this project exists to catch, in its own tree.
        run: |
          node dist/cli.js skills --force
          git diff --exit-code || {
            echo "::error::emitted skills are stale — run 'tripact skills --force' and commit the result"
            exit 1
          }

      - name: Package contents
        # Catches the failure modes that only appear at publish time: a bin target missing from
        # the tarball, or a stale artefact left in dist by a build that did not clean.
        run: |
          npm pack --dry-run
          test -f dist/cli.js
